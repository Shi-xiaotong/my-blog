<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="JSON 格式化工具，支持格式化、压缩、转义、校验，纯浏览器端运行。">
<title>JSON 格式化 - 在线工具</title>
<link rel="stylesheet" href="common.css">
<style>
:root { --bg: #f8f9fa; --border: #e2e8f0; --primary: #3b82f6; }
[data-theme="dark"] { --bg: #1a1a2e; --border: #2d3748; --primary: #60a5fa; }

body { margin: 0; padding: 0; }
.container { max-width: 100%; padding: 16px; }
.header { margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
.header h1 { margin: 0; font-size: 20px; }
.back-link { color: var(--primary); text-decoration: none; font-size: 14px; }

.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar label { font-size: 14px; color: var(--text-secondary); margin-right: 4px; }
.toolbar select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 14px; }

.editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 180px); min-height: 400px; }
@media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; height: auto; } }

.panel { display: flex; flex-direction: column; gap: 8px; }
.panel-header { display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); }

.editor {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
  resize: none;
  outline: none;
  line-height: 1.5;
}
.editor:focus { border-color: var(--primary); }

.output-panel {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: auto;
  padding: 14px;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
  position: relative;
}

.json-key { color: var(--primary); }
.json-string { color: #16a34a; }
.json-number { color: #ea580c; }
.json-boolean { color: #9333ea; }
.json-null { color: #ef4444; }

.error { color: #ef4444; padding: 10px; font-size: 14px; }

/* 折叠功能样式 */
.collapsible-toggle {
  cursor: pointer;
  user-select: none;
  display: inline;
  padding: 2px 6px;
  border-radius: 4px;
}
.collapsible-toggle:hover {
  background: rgba(59, 130, 246, 0.1);
}
.collapse-arrow {
  display: inline-block;
  width: 14px;
  font-size: 10px;
  transition: transform 0.2s;
  margin-right: 2px;
  color: #64748b;
}
.collapse-hint {
  color: #94a3b8;
  font-size: 12px;
  font-style: italic;
}
.collapse-content {
  display: inline;
}
.collapse-content.collapsed {
  display: none;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 1000;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>

<div class="container">
  <div class="header">
    <a href="/tools/" class="back-link" onclick="history.back();return false;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg> 返回工具箱
    </a>
    <h1>JSON 格式化</h1>
  </div>

  <div class="toolbar">
    <label>缩进:</label>
    <select id="indent" onchange="doFormat()">
      <option value="2">2 空格</option>
      <option value="4">4 空格</option>
      <option value="tab">Tab</option>
    </select>
    <button class="btn btn-primary" onclick="doFormat()">格式化</button>
    <button class="btn btn-outline" onclick="doMinify()">压缩</button>
    <button class="btn btn-outline" onclick="doEscape()">转义</button>
    <button class="btn btn-outline" onclick="copyResult()">复制</button>
    <button class="btn btn-outline" onclick="clearAll()">清空</button>
  </div>

  <div class="editor-container">
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">输入 JSON</span>
        <span id="input-info" style="font-size:12px;color:#94a3b8"></span>
      </div>
      <textarea id="input" class="editor" placeholder='在此粘贴 JSON...' spellcheck="false"></textarea>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">输出</span>
        <span id="output-info" style="font-size:12px;color:#94a3b8"></span>
      </div>
      <div id="output" class="output-panel"></div>
    </div>
  </div>
</div>

<script>
function toggleTheme() {
  const h = document.documentElement;
  const d = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', d ? '' : 'dark');
  localStorage.setItem('tool-theme', d ? 'light' : 'dark');
}
(function() {
  const s = localStorage.getItem('tool-theme');
  if (s === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();

function showToast(msg) {
  const d = document.createElement('div');
  d.className = 'toast';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2000);
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function() {
      showToast('已复制到剪贴板');
    }, function() {
      fallbackCopy(t);
    });
  } else {
    fallbackCopy(t);
  }
}

function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  } catch (e) {
    showToast('复制失败，请手动选择');
  }
  document.body.removeChild(ta);
}

let rawResult = '';
let nodeId = 0;

function syntaxHighlight(json) {
  return json.replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?|\bnull\b)/g, function(match) {
    let cls = 'json-number';
    if (/^"/.test(match)) {
      if (/:$/.test(match)) {
        cls = 'json-key';
      } else {
        cls = 'json-string';
      }
    } else if (/true|false/.test(match)) {
      cls = 'json-boolean';
    } else if (/null/.test(match)) {
      cls = 'json-null';
    }
    // 必须转义，否则字符串值里的 < > & 会破坏 HTML 甚至执行脚本（XSS）
    return '<span class="' + cls + '">' + escapeHtml(match) + '</span>';
  });
}

// 构建带折叠功能的 JSON HTML
function buildJSONHTML(obj, depth = 0, indentStr = '  ') {
  if (obj === null) return '<span class="json-null">null</span>';
  if (typeof obj === 'boolean') return '<span class="json-boolean">' + obj + '</span>';
  if (typeof obj === 'number') return '<span class="json-number">' + obj + '</span>';
  if (typeof obj === 'string') return '<span class="json-string">"' + escapeHtml(obj) + '"</span>';

  const indent = indentStr.repeat(depth);
  const childIndent = indentStr.repeat(depth + 1);

  if (Array.isArray(obj)) {
    if (obj.length === 0) return '<span class="json-number">[]</span>';

    const id = 'node_' + (nodeId++);
    // toggle 独占一行；所有换行都在 content 内部，折叠时整块隐藏不残留空行
    let html = '<span class="collapsible-toggle" data-id="' + id + '">';
    html += '<span class="collapse-arrow">▼</span>';
    html += '<span class="collapse-hint">[' + obj.length + ' 项]</span>';
    html += '</span>';
    html += '<span class="collapse-content" id="' + id + '">\n';
    html += indent + '<span class="json-number">[</span>\n';

    for (let i = 0; i < obj.length; i++) {
      html += childIndent;
      html += buildJSONHTML(obj[i], depth + 1, indentStr);
      if (i < obj.length - 1) html += ',';
      html += '\n';
    }

    html += indent + '<span class="json-number">]</span>';
    html += '</span>';
    return html;
  }

  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '<span class="json-number">{}</span>';

    const id = 'node_' + (nodeId++);
    let html = '<span class="collapsible-toggle" data-id="' + id + '">';
    html += '<span class="collapse-arrow">▼</span>';
    html += '<span class="collapse-hint">{' + keys.length + ' 项}</span>';
    html += '</span>';
    html += '<span class="collapse-content" id="' + id + '">\n';
    html += indent + '<span class="json-number">{</span>\n';

    for (let i = 0; i < keys.length; i++) {
      const key = keys[i];
      html += childIndent;
      html += '<span class="json-key">"' + escapeHtml(key) + '"</span>: ';
      html += buildJSONHTML(obj[key], depth + 1, indentStr);
      if (i < keys.length - 1) html += ',';
      html += '\n';
    }

    html += indent + '<span class="json-number">}</span>';
    html += '</span>';
    return html;
  }

  return '<span>' + escapeHtml(String(obj)) + '</span>';
}

function initCollapsible() {
  document.querySelectorAll('.collapsible-toggle').forEach(function(toggle) {
    toggle.addEventListener('click', function() {
      const id = this.getAttribute('data-id');
      const group = document.getElementById(id);
      if (group) {
        group.classList.toggle('collapsed');
        // 折叠时显示 ▶（可展开），展开时显示 ▼（可折叠）
        this.querySelector('.collapse-arrow').textContent = group.classList.contains('collapsed') ? '▶' : '▼';
      }
    });
  });
}

function doFormat() {
  const input = document.getElementById('input').value.trim();
  const outEl = document.getElementById('output');
  const infoEl = document.getElementById('output-info');
  
  if (!input) { outEl.innerHTML = '<span style="color:#94a3b8">等待输入...</span>'; return; }
  
  try {
    const obj = JSON.parse(input);
    const indentSel = document.getElementById('indent').value;
    // 统一为字符串：JSON.stringify 和 buildJSONHTML 都需要字符串缩进
    const indentStr = indentSel === 'tab' ? '\t' : ' '.repeat(parseInt(indentSel) || 2);
    rawResult = JSON.stringify(obj, null, indentStr);
    
    // 使用带折叠功能的渲染（缩进与选择一致）
    nodeId = 0; // 重置节点 ID
    outEl.innerHTML = buildJSONHTML(obj, 0, indentStr);
    initCollapsible(); // 初始化折叠事件
    infoEl.textContent = rawResult.length + ' 字符';
  } catch(e) {
    outEl.innerHTML = '<div class="error">JSON 解析错误: ' + escapeHtml(e.message) + '</div>';
  }
}

function doMinify() {
  const input = document.getElementById('input').value.trim();
  const outEl = document.getElementById('output');
  const infoEl = document.getElementById('output-info');
  
  if (!input) { outEl.innerHTML = ''; return; }
  try {
    const obj = JSON.parse(input);
    rawResult = JSON.stringify(obj);
    outEl.innerHTML = syntaxHighlight(rawResult);
    infoEl.textContent = rawResult.length + ' 字符 (压缩)';
  } catch(e) {
    outEl.innerHTML = '<div class="error">JSON 解析错误: ' + escapeHtml(e.message) + '</div>';
  }
}

function doEscape() {
  const input = document.getElementById('input').value.trim();
  const outEl = document.getElementById('output');
  const infoEl = document.getElementById('output-info');
  
  if (!input) { outEl.innerHTML = ''; return; }
  try {
    const obj = JSON.parse(input);
    rawResult = JSON.stringify(obj);
    outEl.innerHTML = '<span class="json-string">' + escapeHtml(rawResult) + '</span>';
    infoEl.textContent = rawResult.length + ' 字符 (转义)';
  } catch(e) {
    rawResult = JSON.stringify(input);
    outEl.innerHTML = '<span class="json-string">' + escapeHtml(rawResult) + '</span>';
    const infoEl = document.getElementById('output-info');
    infoEl.textContent = rawResult.length + ' 字符 (转义)';
  }
}

function copyResult() {
  if (rawResult) {
    copyText(rawResult);
  } else {
    showToast('没有可复制的内容');
  }
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').innerHTML = '<span style="color:#94a3b8">等待输入...</span>';
  document.getElementById('output-info').textContent = '';
  rawResult = '';
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 自动格式化 - 必须放在所有函数定义之后
window.addEventListener('DOMContentLoaded', function() {
  let debounceTimer;
  document.getElementById('input').addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(doFormat, 500);
  });
});
</script>
<script src="track.js"></script>
</body>
</html>
