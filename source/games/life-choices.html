<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生选择题 - 小游戏</title>
<link rel="stylesheet" href="/games/common.css">
<style>
.lc-container { max-width: 560px; margin: 0 auto; }

/* Phase header */
.lc-phase { text-align: center; margin-bottom: 20px; }
.lc-phase .lc-age { font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; margin-bottom: 6px; }
.lc-phase h2 { font-size: 1.8em; margin-bottom: 4px; }
.lc-phase .lc-intro { font-size: 14px; color: var(--text-secondary); max-width: 420px; margin: 8px auto 0; line-height: 1.6; }

/* Attribute panel */
.lc-attrs { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.lc-attr { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 96px; text-align: center; transition: transform 0.2s, border-color 0.2s; }
.lc-attr .lc-attr-icon { font-size: 18px; margin-bottom: 2px; }
.lc-attr .lc-attr-icon svg { width: 20px; height: 20px; display: block; margin: 0 auto; color: var(--primary); }
.lc-attr .lc-attr-name { font-size: 11px; color: var(--text-secondary); }
.lc-attr .lc-attr-val { font-size: 20px; font-weight: 700; font-family: 'SF Mono', monospace; margin-top: 2px; }
.lc-attr .lc-attr-delta { font-size: 12px; font-weight: 600; height: 16px; }
.lc-attr.bump { transform: scale(1.06); border-color: var(--primary); }
.lc-attr-delta.up { color: var(--accent); }
.lc-attr-delta.down { color: var(--danger); }

/* Option cards */
.lc-options { display: flex; flex-direction: column; gap: 12px; }
.lc-option { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; cursor: pointer; transition: all 0.18s ease; text-align: left; width: 100%; }
.lc-option:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.lc-option:active { transform: translateY(0); }
.lc-option-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.lc-option-icon { font-size: 24px; line-height: 1; }
.lc-option-icon svg { width: 24px; height: 24px; color: var(--primary); }
.lc-option-title { font-size: 16px; font-weight: 600; }
.lc-option-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.lc-option-hint { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--warning); background: rgba(245,158,11,0.12); padding: 2px 8px; border-radius: 6px; }

/* Choice echo (what player picked) */
.lc-echo { background: var(--primary-light, rgba(59,130,246,0.12)); border: 1px solid var(--primary); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; font-size: 14px; animation: lcFadeIn 0.4s ease; }
.lc-echo strong { color: var(--primary); }
.lc-echo svg { width: 18px; height: 18px; vertical-align: -3px; color: var(--primary); margin-right: 4px; }

/* Ending */
.lc-ending { text-align: center; animation: lcFadeIn 0.5s ease; }
.lc-ending-emoji { font-size: 56px; margin-bottom: 12px; }
.lc-ending-emoji svg { width: 64px; height: 64px; color: var(--primary); display: block; margin: 0 auto; }
.lc-ending-title { font-size: 1.6em; font-weight: 700; margin-bottom: 10px; }
.lc-ending-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.8; max-width: 440px; margin: 0 auto 24px; }
.lc-ending-attrs { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
.lc-ending-flag { display: inline-block; margin-bottom: 16px; font-size: 13px; color: var(--warning); background: rgba(245,158,11,0.12); padding: 4px 12px; border-radius: 8px; }

/* Buttons */
.lc-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.lc-btn { padding: 10px 24px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
.lc-btn-primary { background: var(--primary); color: #fff; }
.lc-btn-primary:hover { filter: brightness(1.1); }
.lc-btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.lc-btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.lc-btn-ghost { background: transparent; border: 1px dashed var(--border); color: var(--text-secondary); font-weight: 400; }
.lc-btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

/* Animations */
@keyframes lcFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.lc-fade-in { animation: lcFadeIn 0.4s ease; }

/* Mobile */
@media (max-width: 480px) {
  .lc-attr { min-width: 80px; padding: 8px 10px; }
  .lc-attr .lc-attr-val { font-size: 17px; }
  .lc-phase h2 { font-size: 1.4em; }
  .lc-ending-emoji { font-size: 44px; }
  .lc-ending-emoji svg { width: 48px; height: 48px; }
}
</style>
</head>
<body>
<div id="page">
<header class="game-page-header">
  <a href="/games/" class="back-link">&larr; 返回游戏列表</a>
  <h1>人生选择题</h1>
</header>
<main class="game-main">
<div class="container">
  <div id="lcGame"></div>
</div>
</main>
<footer class="game-page-footer">233002.xyz</footer>
</div>
<script src="/games/js/life-choices.js"></script>
</body>
</html>
